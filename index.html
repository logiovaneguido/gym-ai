<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#c6f24e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym AI">
<title>Gym AI</title>
<style>
  :root{
    --lime:#c6f24e; --lime-d:#b0e02f; --ink:#2e2e2e; --ink2:#555; --bg:#ededed;
    --card:#ffffff; --line:#e2e2e2; --muted:#8a8a8a;
    --i1:#77c043; --i2:#e2e63a; --i3:#f2a03d; --i4:#e5533c; --red:#e5533c;
    --shadow:0 6px 20px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;}
  body{max-width:520px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden;}
  h1,h2,h3{margin:0;letter-spacing:-.02em;}
  .app{padding:18px 16px 100px;}
  .hidden{display:none!important;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .btn{background:var(--lime);color:var(--ink);font-weight:800;font-size:16px;
    padding:16px;border-radius:14px;width:100%;text-transform:uppercase;letter-spacing:.02em;
    box-shadow:var(--shadow);transition:transform .05s;}
  .btn:active{transform:scale(.98);}
  .btn.dark{background:var(--ink);color:#fff;}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:none;border:1.5px solid var(--line);}
  .btn.red{background:var(--red);color:#fff;}
  .btn.sm{font-size:13px;padding:10px 14px;width:auto;border-radius:10px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .logo{font-weight:900;font-size:26px;letter-spacing:-.04em;}
  .logo span{background:var(--lime);padding:0 6px;border-radius:6px;}
  .pill{background:var(--lime);color:var(--ink);font-weight:800;font-size:12px;
    padding:5px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
  .pill.grey{background:#e0e0e0;color:#555;}
  .muted{color:var(--muted);}
  .card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .selcard{background:#fff;border-radius:16px;padding:16px;border:2.5px solid var(--line);
    cursor:pointer;transition:.12s;}
  .selcard.on{border-color:var(--ink);background:var(--lime);}
  .selcard .t{font-weight:800;font-size:16px;}
  .selcard .d{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.3;}
  .selcard.on .d{color:#3a3a3a;}
  .label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 10px;}
  /* block card */
  .blk{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden;}
  .blk .tag{position:absolute;top:0;left:0;background:var(--ink);color:#fff;font-size:10px;font-weight:800;
    padding:4px 10px;border-bottom-right-radius:10px;text-transform:uppercase;letter-spacing:.04em;}
  .blk.warm .tag{background:var(--red);}
  .blk h3{font-size:22px;font-weight:900;margin:20px 0 2px;letter-spacing:-.03em;}
  .blk .sub{font-size:12px;font-weight:700;color:var(--ink2);background:#f0f0f0;display:inline-block;
    padding:4px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.02em;}
  .blk .time{position:absolute;top:12px;right:12px;text-align:center;background:#fff;border-radius:10px;
    padding:4px 8px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .blk .time b{font-size:18px;font-weight:900;display:block;}
  .movs{margin-top:10px;font-size:14px;color:#3a3a3a;line-height:1.7;}
  .movs .mv b{display:inline-block;min-width:34px;font-weight:800;}
  .dots{display:flex;gap:4px;align-items:center;margin-top:10px;}
  .dot{width:10px;height:10px;border-radius:50%;background:#ddd;}
  .region{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.05em;}
  .blkfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;
    justify-content:center;}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px 28px;
    max-height:88vh;overflow-y:auto;animation:up .2s ease;}
  @keyframes up{from{transform:translateY(30px);opacity:.6;}to{transform:none;opacity:1;}}
  .alt{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;}
  .alt:active{background:#f6f6f6;}
  .alt .at{font-weight:800;}
  .banner{background:#fff8e1;border:1.5px solid #f2d675;border-radius:14px;padding:12px 14px;
    font-size:13px;color:#7a5c00;margin-bottom:14px;line-height:1.4;}
  .banner b{color:#5a4400;}
  /* exec */
  .totwrap{background:var(--ink);color:#fff;border-radius:18px;padding:16px;text-align:center;margin-bottom:14px;position:sticky;top:8px;z-index:5;}
  .totwrap .lab{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.7;}
  .totwrap .clock{font-size:34px;font-weight:900;letter-spacing:.02em;}
  .totbar{height:6px;background:#4a4a4a;border-radius:6px;overflow:hidden;margin-top:8px;}
  .totbar>i{display:block;height:100%;background:var(--lime);width:0;transition:width 1s linear;}
  .phase{background:#fff;border-radius:18px;padding:22px 16px;text-align:center;box-shadow:var(--shadow);margin-bottom:14px;}
  .phase .ptype{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
  .phase .pclock{font-size:64px;font-weight:900;letter-spacing:.01em;line-height:1.05;margin:6px 0;}
  .phase .pname{font-size:20px;font-weight:900;}
  .phase.rest{background:#eef7d8;}
  .phase.prep{background:#fdeee6;}
  .steps{display:flex;gap:6px;justify-content:center;margin:14px 0;}
  .step{flex:1;height:7px;border-radius:6px;background:#e0e0e0;max-width:56px;}
  .step.done{background:var(--i1);} .step.now{background:var(--lime);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:99;box-shadow:var(--shadow);}
  .streak{display:flex;align-items:center;gap:12px;}
  .streak .num{font-size:40px;font-weight:900;line-height:1;}
  .hist{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);}
  .hist:last-child{border:none;}
  .navwarn{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;}
  .footnote{font-size:11px;color:var(--muted);text-align:center;margin-top:24px;line-height:1.5;}
  a.link{color:#3a7a1e;font-weight:700;cursor:pointer;text-decoration:underline;}
  .movs .mv{cursor:pointer;padding:3px 0;border-radius:6px;}
  .movs .mv:active{background:#f4f4f4;}
  .mven{color:var(--muted);font-size:12px;font-style:italic;}
  .mvi{color:var(--lime-d);font-weight:900;font-size:13px;}
  .mediaB{background:#f2f2f2;border:1.5px dashed #cfcfcf;border-radius:14px;height:210px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:8px;text-align:center;padding:14px;}
  .mediaB video,.mediaB img{width:100%;height:100%;object-fit:contain;border-radius:14px;}
  .cue{font-size:14px;line-height:1.5;color:#444;}
  .matchip{display:inline-block;background:var(--ink);color:#fff;font-size:11px;font-weight:800;
    padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ============================================================
   GYM AI · MVP v1  (motor determinista, sin backend, offline)
   Basado en PRD 003 v1.1
   ============================================================ */

/* ---------- STORAGE ADAPTER (localStorage con fallback en memoria) ---------- */
const Store = (()=>{
  let mem={}, ok=true;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ ok=false; }
  return {
    ok,
    get(k){ if(ok){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){} } return k in mem?mem[k]:null; },
    set(k,v){ if(ok){ try{ localStorage.setItem(k,JSON.stringify(v)); return; }catch(e){} } mem[k]=v; }
  };
})();

/* ---------- CONFIG ---------- */
const APP_VERSION='v6 · QA 2026-09-01 (técnica escrita 85/85 · GIF animados · offline)';
const OBJETIVOS = [
  {id:'hipertrofia', t:'Hipertrofia', d:'Ganar masa muscular'},
  {id:'fuerza',      t:'Fuerza',      d:'Fuerza máxima'},
  {id:'resistencia', t:'Resistencia', d:'Aeróbico y acondicionamiento'},
  {id:'rendimiento', t:'Rendimiento', d:'Potencia y deporte (fútbol)'},
  {id:'salud',       t:'Salud general', d:'Recomposición y mantenimiento'}
];
const NIVELES = [
  {id:'principiante', t:'Principiante'},
  {id:'intermedio',   t:'Intermedio'},
  {id:'avanzado',     t:'Avanzado'}
];
const NIVEL_RANK = {principiante:1, intermedio:2, avanzado:3};

// Matriz de proporción objetivo -> categoría (1..5, nunca 0). §8.2
const WEIGHTS = {
  'Hypertrophy':            {hipertrofia:5,fuerza:2,resistencia:1,rendimiento:1,salud:3},
  'Traditional Hypertrophy':{hipertrofia:5,fuerza:2,resistencia:1,rendimiento:1,salud:3},

  'FBA':                    {hipertrofia:2,fuerza:2,resistencia:3,rendimiento:3,salud:3},
  'Full Body':              {hipertrofia:3,fuerza:2,resistencia:3,rendimiento:2,salud:4},
  'Upper Body':             {hipertrofia:4,fuerza:3,resistencia:2,rendimiento:2,salud:3},
  'Lower Body':             {hipertrofia:4,fuerza:3,resistencia:2,rendimiento:3,salud:3},
  'Midline':                {hipertrofia:2,fuerza:2,resistencia:2,rendimiento:2,salud:3},

// Banda de intensidad total del día (suma de 4 bloques) por objetivo. §8.1 Paso5
const BANDA = {hipertrofia:[8,13],fuerza:[10,16],resistencia:[10,16],rendimiento:[10,15],salud:[7,12]};
const REST_S = 90;   // descanso entre bloques
const PREP_S = 15;   // preparación inicial

/* ---------- CATÁLOGO DE BLOQUES ----------
   m(cat,variante,formato,dur,region,intensidad,nivel,pesoDesaf, movimientos[[reps,nombre]]) */

function m(cat,variante,formato,dur,region,inten,nivel,peso,movs){
  return {id:'b'+(++_id),cat,variante,formato,dur,esLargo:dur>=12,region,inten,nivel,peso,
          movs:movs.map(x=>({r:String(x[0]),n:x[1]}))};
}
const FMT = {ROUNDS:'COMPLETE {r} ROUNDS IN {d}\'', AMRAP:'AMRAP IN {d}\'', EMOM:'EVERY 60" X {d}\'',
             INTERVAL:'30" ON / 30" OFF X {d}\'', WARMUP:'WARM UP · {d}\''};

 /* ---- WARMUPS (4') ---- */

 m('Hypertrophy','UPPER BUILDING','EMOM',7,'upper',3,'intermedio',false,[[10,'Push Ups'],[10,'DDB Incline Flys Chest'],[10,'MB Deficit Push Up']]),
 m('Hypertrophy','LOWER BUILDING','EMOM',7,'lower',3,'intermedio',false,[[10,'SKB Box Ham Curls'],[10,'DDB Romanian Deadlift'],['10/10','DKB Farmer Bulgarian Squat']]),

 m('Lower Body','INTRO','ROUNDS',7,'lower',2,'principiante',false,[['12/12','Banded Glute Bridge Abduction'],['20"/20"','Banded Glute Bridge Hold + Abduction'],['30"','Squat Hold']]),
 m('Midline','MIDLINE ON FIRE','AMRAP',7,'core',3,'intermedio',false,[[12,'Hanging Knees To Elbow'],[15,'Zombie Sit Ups'],[12,'Dynamic Tall Plank']]),
 m('Midline','ASYMMETRY WORK','AMRAP',7,'core',2,'intermedio',false,[[10,'Pallof split stance change'],['6/6','Reverse Lunge + Pallof Rotation'],['30"/30"','Copenhagen Plank']]),
 m('HIIT','BODYWEIGHT','INTERVAL',7,'full',4,'principiante',false,[[1,'Air Squat'],[1,'Skipping'],[1,'Hollow Rocks'],[1,'Squats In & Out'],[1,'Tall Plank'],[1,'Plank Jack'],[1,'V-Sit Ups']]),
 m('HIIT','NO IMPACT','INTERVAL',7,'full',3,'intermedio',false,[[1,'SKB Skier Swing'],[1,'Sit Ups'],[1,'SKB Single-Arm Swing + Pull'],[1,'DKB Bent Over Row'],[1,'KB Halo'],[1,'KB Russian Twist'],[1,'SKB Gunslinger']]),
 m('Sport','SPEED POWER','AMRAP',7,'lower',3,'intermedio',false,[[10,'Heidens'],['6/6','Skater Squats'],[8,'Side Skip to Heiden']]),
 m('Sport','CORE CONTROL','AMRAP',7,'core',3,'intermedio',false,[['8/8','DKB Renegade Rows'],['30"','Hollow Hold'],[10,'Hollow Body Alt. Shotguns']]),
 m('Pilates','INTRO','ROUNDS',7,'core',1,'principiante',false,[[10,'Ham Roller Bridge slides'],['10/10','Ham Roller Quadruped Abductions'],['40"','Ham Roller Adho Mukha']])
];
const WARMS = CATALOG.filter(b=>b.formato==='WARMUP');

/* ===================================================================
   BIBLIOTECA DE EJERCICIOS + COMPOSITOR (gym comercial: máquina+libre+piso)
   Reglas basadas en ACSM 2026, NSCA (hipertrofia regional) y revisión

function eqMat(eq,en){ if(eq==='maq')return 'Máquina'; if(eq==='piso')return /band/i.test(en)?'Banda':'Peso corporal';
  return /barbell/i.test(en)?'Barra':(/kettlebell/i.test(en)?'Pesa rusa':'Mancuerna'); }
// Resolución de nombre ES/EN + material para cualquier movimiento (LIB o warmup)
function movInfo(enKey){ const x=LIB_BY_EN[enKey];
  if(x) return {es:x.es,en:x.en,mat:eqMat(x.eq,x.en)};
  const t=traducir(enKey); return {es:t.es,en:t.en,mat:(MAT_ES[inferMat(enKey)]||'Peso corporal')}; }

// ---- Selección ponderada (prefiere nivel <= usuario, compound primero) ----
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function weightedPick(arr,userNivel,rng){ if(!arr||!arr.length)return null;
  const ur=NIVEL_RANK[userNivel];
  const sc=arr.map(x=>{const over=NIVEL_RANK[x.lvl]>ur?0.3:1; const roleW=x.role==='comp'?1.25:1;
    return {x,s:Math.pow(over*roleW,1.4)*(0.8+rng()*0.4)};});
  const tot=sc.reduce((a,b)=>a+b.s,0); let rv=rng()*tot;
  for(const o of sc){rv-=o.s;if(rv<=0)return o.x;} return sc[sc.length-1].x; }
// DEPTH: un músculo, varios ángulos + mezcla de equipamiento (maq+lib+piso)
function pickDepth(M,nMov,userNivel,used,rng){
  const pool=LIB.filter(x=>x.mu===M && !used.has(x.id)); const chosen=[];
  const comps=pool.filter(x=>x.role==='comp'&&(x.eq==='maq'||x.eq==='lib'));
  const first=weightedPick(comps,userNivel,rng)||weightedPick(pool,userNivel,rng);
  if(first)chosen.push(first);
  while(chosen.length<nMov){
    const usedEq=new Set(chosen.map(c=>c.eq)); const missing=['maq','lib','piso'].filter(e=>!usedEq.has(e));
    let cand=pool.filter(x=>!chosen.includes(x)&&(missing.length?missing.includes(x.eq):true));
    if(!cand.length)cand=pool.filter(x=>!chosen.includes(x));
    const p=weightedPick(cand,userNivel,rng); if(!p)break; chosen.push(p);
  }
  return chosen;
}
// COMPLEMENTARITY: varios músculos que se complementan + mezcla de equipamiento
// COMPLEMENTARIEDAD = agonista-antagonista / sinergistas de la MISMA región (series pareadas).
// Nunca mezcla regiones no relacionadas (ej. hombros + gemelos): la coherencia muscular manda sobre el mix de equipo.
function pickComplement(muscles,nMov,userNivel,used,rng){
  const chosen=[]; const order=shuffle(muscles,rng);
  for(const M of order){ if(chosen.length>=nMov)break;
    const usedEq=new Set(chosen.map(c=>c.eq)); const missing=['maq','lib','piso'].filter(e=>!usedEq.has(e));
    let pool=LIB.filter(x=>x.mu===M&&!used.has(x.id)&&!chosen.includes(x));
    let cand=pool.filter(x=>missing.length?missing.includes(x.eq):true); if(!cand.length)cand=pool;
    const p=weightedPick(cand,userNivel,rng); if(p)chosen.push(p); }
  while(chosen.length<nMov){   // completar SOLO con músculos del mismo grupo
    const usedEq=new Set(chosen.map(c=>c.eq)); const missing=['maq','lib','piso'].filter(e=>!usedEq.has(e));
    let pool=LIB.filter(x=>muscles.includes(x.mu)&&!chosen.includes(x)&&!used.has(x.id));
    let cand=pool.filter(x=>missing.length?missing.includes(x.eq):true); if(!cand.length)cand=pool;
    if(!cand.length)break;
    const p=weightedPick(cand,userNivel,rng); if(!p)break; chosen.push(p); }
  return chosen;
}
function repScheme(obj,role){const T={fuerza:{comp:'5',acc:'8'},hipertrofia:{comp:'8-10',acc:'12'},
  salud:{comp:'10',acc:'12-15'},resistencia:{comp:'15',acc:'20'},rendimiento:{comp:'6',acc:'10'}};
  return (T[obj]||T.hipertrofia)[role];}
function objFormato(obj,esLargo){ if(obj==='fuerza')return'ROUNDS'; if(obj==='resistencia')return esLargo?'AMRAP':'EMOM';
  if(obj==='rendimiento')return esLargo?'ROUNDS':'AMRAP'; return'ROUNDS';}
function objInten(obj,esLargo,core){ if(core)return 2;
  if(obj==='fuerza')return esLargo?4:3; if(obj==='resistencia')return esLargo?4:3;
  if(obj==='salud')return 2; return 3;}
function styleFor(obj){return {hipertrofia:'Hypertrophy',fuerza:'Strength',resistencia:'Conditioning',rendimiento:'Power',salud:'Full Body'}[obj]||'Hypertrophy';}
function composeBlock(obj,nivel,spec,used,rng){
  const nMov=3, esLargo=!!spec.esLargo;
  let movs = spec.core ? pickDepth('core',nMov,nivel,used,rng)
           : spec.logic==='depth' ? pickDepth(spec.target,nMov,nivel,used,rng)
           : pickComplement(spec.target,nMov,nivel,used,rng);
  movs.forEach(mm=>used.add(mm.id));
  const eqO={maq:0,lib:1,piso:2};
  movs.sort((a,b)=>((a.role==='comp'?0:1)-(b.role==='comp'?0:1))||(eqO[a.eq]-eqO[b.eq]));
  const bmovs=movs.map(mm=>({r:repScheme(obj,mm.role)+(mm.unil?' /lado':''),n:mm.en,id:mm.id}));
  const _regs=[...new Set(movs.map(mm=>mm.region))];   // región REAL según los ejercicios que entraron
  const region = spec.core?'core':(_regs.length===1?_regs[0]:'full');
  const foco = spec.core?'Core · Profundidad'
    : (spec.logic==='depth'?('Profundidad · '+(MU_ES[spec.target]||spec.target))
       :('Complementariedad · '+regLabel(region)));
  const nivelB=movs.reduce((mx,mm)=>Math.max(mx,NIVEL_RANK[mm.lvl]),1);
  const equipMix=[...new Set(movs.map(mm=>mm.eq))];
  return {id:'blk'+Math.floor(rng()*1e9)+'_'+_mid, cat:styleFor(obj), variante:foco.toUpperCase(),
    formato:objFormato(obj,esLargo), dur:esLargo?14:7, esLargo, region,
    inten:objInten(obj,esLargo,spec.core), nivel:['','principiante','intermedio','avanzado'][nivelB],
    peso:obj==='fuerza', movs:bmovs, logic:spec.core?'core':spec.logic, equipMix};
}
// Plan del día: qué bloques y con qué lógica (split PPL para hipertrofia/fuerza/salud)
function dayPlan(obj,idx,rng){
  if(obj==='resistencia'||obj==='rendimiento'){
    // full-body A LO LARGO de la rutina, pero cada bloque coherente (circuito de empuje, de piernas, de tracción)
    const PUSH=['pecho','hombros','triceps'], PULL=['espalda','biceps'], LEGS=['cuadriceps','isquios','gluteos','pantorrillas'];
    const rot=[[PUSH,LEGS,PULL],[LEGS,PULL,PUSH],[PULL,PUSH,LEGS]][idx%3];
    return [{logic:'complement',target:rot[0],esLargo:true},{logic:'complement',target:rot[1],esLargo:false},
            {logic:'complement',target:rot[2],esLargo:true},{logic:'complement',target:['core'],esLargo:false,core:true}];
  }
  const SPL=[{mus:['pecho','hombros','triceps']},{mus:['espalda','biceps']},
             {mus:['cuadriceps','isquios','gluteos','pantorrillas']}];
  const day=SPL[idx%3], m0=day.mus[0], m1=day.mus[1]||day.mus[0];
  return [{logic:'depth',target:m0,esLargo:true},
          {logic:'complement',target:day.mus,esLargo:false},
          {logic:'depth',target:m1,esLargo:true},
          {logic:'complement',target:['core'],esLargo:false,core:true}];
}

  if(/smith/.test(s))return'smith';
  if(/lever|machine|sled|hack/.test(s))return'machine';
  return'bodyweight';}
function wantEquip(enKey){ const x=LIB_BY_EN[enKey];
  if(x){ if(x.eq==='maq')return'machine'; if(x.eq==='piso')return equipSig(enKey)==='band'?'band':'bodyweight'; return equipSig(enKey); }
  return equipSig(enKey); }
function equipOk(want,cand){
  if(want===cand)return true;
  if(cand==='band'&&want!=='band')return false;                 // nunca banda si no la queremos
  const maq=new Set(['machine','cable','smith','lever']);
  if((want==='machine'||want==='cable')&&maq.has(cand))return true;
  if(want==='bodyweight')return cand==='bodyweight';            // peso corporal: solo peso corporal
  if(want==='barbell')return cand==='barbell'||cand==='smith';
  if(want==='dumbbell')return cand==='dumbbell';
  if(want==='kettlebell')return cand==='kettlebell'||cand==='dumbbell';
  if(want==='band')return cand==='band';
  return false;}
function posOk(a,b){a=a.toLowerCase();b=b.toLowerCase();
  for(const p of ['incline','decline','kneeling']){ if(a.includes(p)!==b.includes(p))return false; } return true;}
// Nombres de origen (Bigg / warm-up) -> nombre estándar buscable en la base (null = sin demo conocida)
const NAME_MAP={
 'Kneeling Scapular Push Ups':'Scapular Push-Up','Asymmetric Scapular Rotation':null,'Bird Dogs':'Bird Dog',
 'Plank Shoulder Taps':'Plank Shoulder Tap','Sprawls':'Sprawl','Hip Swivels':null,'Banded Clamshell':'Band Clam',
 'Happy-Angry Cat':'Cat Cow','Cossacks':'Cossack Squat','Jumping Jacks':'Jumping Jack','Inchworm':'Inchworm',
 'World’s Greatest Stretch':'World Greatest Stretch','Air Squats':'Bodyweight Squat'
};
function gifDone(){ if(typeof window!=='undefined'&&window._onGif){try{window._onGif();}catch(e){}} }
async function buildGifIndex(){
  try{
    const cached=Store.get('gifidx_v2'); if(cached&&cached.length){GIFIDX=cached;GIF_STATUS='ok';gifDone();return;}
    if(typeof fetch!=='function'){GIF_STATUS='fail';gifDone();return;}

// GIF SOLO si hay match de alta confianza: identidad ⊆ candidato + equipamiento compatible + postura compatible.
// Si no hay match seguro devuelve null (mejor "sin demo" que una demo equivocada).
// Músculo aproximado de un movimiento (para buscar alternativa del mismo músculo)
const WARMUP_MU={'Kneeling Scapular Push Ups':'espalda','Asymmetric Scapular Rotation':'hombros','Bird Dogs':'core',
 'Plank Shoulder Taps':'core','Sprawls':'cuadriceps','Hip Swivels':'gluteos','Banded Clamshell':'gluteos',
 'Happy-Angry Cat':'core','Cossacks':'cuadriceps','Jumping Jacks':'cuadriceps','Inchworm':'core',
 'World’s Greatest Stretch':'cuadriceps','Air Squats':'cuadriceps'};
function muscleOf(base){ return LIB_BY_EN[base]?LIB_BY_EN[base].mu:(WARMUP_MU[base]||null); }
// Match directo: exacto (equip+postura OK) o aproximado (mismo movimiento, distinto implemento/postura)
function gifDirect(name,want){
  if(!GIFIDX)return null;
  const idOur=idTok(name); if(!idOur.length)return null;
  let ex=null,exQ=1e9, ap=null,apQ=1e9;
  for(const rec of GIFIDX){
    const idc=rec[0]?rec[0].split(' '):[], cname=rec[2]||'';
    if(!idOur.every(t=>idc.includes(t)))continue;
    const extra=idc.length-idOur.length; if(extra>2)continue;
    if(equipOk(want,equipSig(cname))&&posOk(name,cname)){ if(extra<exQ){ex=rec[1];exQ=extra;} }
    else { if(extra<apQ){ap=rec[1];apQ=extra;} }
  }
  if(ex)return{url:ex,tier:'exact'};
  if(ap)return{url:ap,tier:'aprox'};
  return null;
}
// Resolución con 3 niveles: exacto -> aproximado (mismo músculo) -> alternativa (otro ejercicio del mismo músculo)
function resolveGifRich(base){
  // 1) Asset local self-hosted (funciona offline, no depende de la base externa)
  if(MEDIA[base])return{url:MEDIA[base],tier:'local',note:(NOTE_MEDIA[base]||'')};
  // 2) Índice online (solo si cargó) para lo que no tenga asset local (ej. calentamientos)
  if(!GIFIDX)return null;
  let name = (base in NAME_MAP)? NAME_MAP[base] : base;
  if(name!==null){ const d=gifDirect(name,wantEquip(base)); if(d)return d; }
  // 3) alternativa: otro ejercicio del mismo músculo que sí tenga demo
  const mu=muscleOf(base);
  if(mu){ for(const x of LIB){ if(x.mu!==mu||x.en===base)continue;
    if(MEDIA[x.en])return{url:MEDIA[x.en],tier:'alt',altEs:x.es,altEn:x.en};
    const d=gifDirect(x.en,wantEquip(x.en)); if(d)return{url:d.url,tier:'alt',altEs:x.es,altEn:x.en}; } }
  return null;
}

/* ---------- SEEDED RNG (determinismo) ---------- */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- MOTOR: genera la rutina componiendo bloques ---------- */
function generarRutina(obj,nivel,hist,seedExtra){
  const seed=hashStr(obj+'|'+nivel+'|'+(hist.length)+'|'+(seedExtra||''));
  const rng=mulberry32(seed);
  const used=new Set();                 // evita repetir el mismo ejercicio dentro del día
  const specs=dayPlan(obj,hist.length,rng);
  const bloques=specs.map(sp=>composeBlock(obj,nivel,sp,used,rng));
  const domReg=(bloques.find(b=>b.esLargo)||{}).region||'full';
  const warm=WARMS.find(w=>w.region===domReg)||WARMS.find(w=>w.region==='full');
  const durTot=warm.dur+bloques.reduce((a,b)=>a+b.dur,0)+bloques.length*(REST_S/60);
  return {fecha:todayKey(), objetivo:obj, nivel, warmup:warm, bloques,
          durEstim:Math.round(durTot), removed:[]};
}

    // circuito de complementariedad COHERENTE (misma región del bloque actual, no full-body)
    const grp = cur.region==='lower'?['cuadriceps','isquios','gluteos','pantorrillas']
              : cur.region==='upper'?['pecho','espalda','hombros','biceps','triceps'] : regionMus;
    alts.push(makeAlt(idx,{logic:'complement',target:grp,esLargo},'circ'));
  }
  modalEl.innerHTML=`<div class="overlay" id="ov"><div class="sheet">
    <div class="row between"><div style="font-weight:900;font-size:18px">Cambiar bloque ${esLargo?'largo':'corto'}</div>

    <div id="alts"></div>
    ${isCore?'':`<div class="label">O elegí el músculo a trabajar (profundidad)</div><div id="musgrid"></div>`}
  </div></div>`;
  const ac=$('#alts'); alts.forEach(b=>ac.appendChild(altEl2(b,idx)));
  if(!isCore){ const mg=$('#musgrid'); mg.style.display='flex'; mg.style.flexWrap='wrap'; mg.style.gap='8px';
    Object.keys(MU_ES).filter(m=>m!=='core').forEach(mu=>{
      const c=document.createElement('button'); c.className='btn ghost sm'; c.textContent=MU_ES[mu];
      c.onclick=()=>applyAlt(idx,makeAlt(idx,{logic:'depth',target:mu,esLargo},'m_'+mu)); mg.appendChild(c);});
  }
  $('#cl').onclick=()=>modalEl.innerHTML='';
  $('#ov').onclick=e=>{if(e.target.id==='ov')modalEl.innerHTML='';};
}
function altEl2(b,idx){

  d.innerHTML=`<div class="row between"><div><div class="at">${esc(b.variante)}</div>

    <div class="dot" style="width:14px;height:14px;background:${icolor(b.inten)}"></div></div>`;
  d.onclick=()=>applyAlt(idx,b);

}

/* ---------- SONIDO (Web Audio API, sin archivos) ---------- */
let AC=null, SOUND=true;
function initAudio(){ try{ if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();} if(AC.state==='suspended')AC.resume(); }catch(e){} }
// Chicharra/silbato FUERTE (ondas cuadradas/diente de sierra, volumen alto) — audible en parlante de celular
function tone(freq,dur,type,vol){ try{ if(!AC||!SOUND)return; const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.value=freq; o.connect(g); g.connect(AC.destination);
  const t=AC.currentTime, v=vol||0.6, d=dur||0.3;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.012);
  g.gain.setValueAtTime(v,t+d-0.04); g.gain.linearRampToValueAtTime(0,t+d);
  o.start(t); o.stop(t+d+0.02); }catch(e){} }
function sweep(f1,f2,dur,vol){ try{ if(!AC||!SOUND)return; const o=AC.createOscillator(),g=AC.createGain();
  o.type='sawtooth'; o.connect(g); g.connect(AC.destination); const t=AC.currentTime, v=vol||0.6, d=dur||0.35;
  o.frequency.setValueAtTime(f1,t); o.frequency.linearRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.02); g.gain.setValueAtTime(v,t+d-0.05); g.gain.linearRampToValueAtTime(0,t+d);
  o.start(t); o.stop(t+d+0.02); }catch(e){} }
function sBlockStart(){ sweep(700,1400,0.4,0.6); }                                              // silbato ascendente
function sBlockEnd(){ tone(320,0.45,'square',0.65); setTimeout(()=>tone(320,0.45,'square',0.65),130); } // chicharra doble grave
function sRestStart(){ tone(600,0.3,'triangle',0.45); }                                          // inicio descanso
function sWarn10(){ tone(1100,0.2,'square',0.6); setTimeout(()=>tone(1100,0.2,'square',0.6),240); } // faltan 10s (doble)
function sTick(){ tone(1500,0.1,'square',0.55); }                                                // 3-2-1

/* ---------- EXEC (doble timer) ---------- */
let EX=null, TICK=null;
function buildPhases(r){
  const ph=[{type:'prep',name:'Preparate',dur:PREP_S}];
  ph.push({type:'block',name:r.warmup.cat+' · Warm-up',dur:r.warmup.dur*60,ref:r.warmup,warm:true});
  r.bloques.forEach((b,i)=>{
    ph.push({type:'rest',name:'Descanso',dur:REST_S});
    ph.push({type:'block',name:'Bloque '+(i+1)+' · '+b.cat,dur:b.dur*60,ref:b,idx:i});
  });
  return ph;
}
function startExec(){
  initAudio();                            // desbloquea el audio con el gesto del usuario
  const r=S.routine;
  const phases=buildPhases(r);
  const total=phases.reduce((a,p)=>a+p.dur,0);
  EX={r,phases,idx:0,total,totalRem:total,phaseRem:phases[0].dur,running:true,blockStarted:true,
      finalizados:[],cancelados:[]};
  drawExec();
  clearInterval(TICK);TICK=setInterval(tick,1000);
}
function tick(){
  if(!EX||!EX.running)return;
  const ph=EX.phases[EX.idx];
  const active = (ph.type!=='block' || EX.blockStarted);
  EX.totalRem--;
  if(active) EX.phaseRem--;
  // avisos sonoros: 10s restantes y cuenta regresiva 3-2-1
  if(active){ if(EX.phaseRem===10) sWarn10(); else if(EX.phaseRem<=3 && EX.phaseRem>=1) sTick(); }
  if(EX.phaseRem<=0){ advance('timer'); }
  else drawExec();
}
function advance(reason){
  const ph=EX.phases[EX.idx];
  if(ph.type==='block' && reason!=='cancel'){ EX.finalizados.push(ph.ref.id); sBlockEnd(); }
  EX.idx++;
  if(EX.idx>=EX.phases.length){ return finishRoutine('CompletoTimer'); }
  const np=EX.phases[EX.idx];
  EX.phaseRem=np.dur;
  EX.blockStarted = np.type!=='block';   // prep/rest corren solos; bloque espera "Iniciar"
  if(np.type==='rest') sRestStart();
  drawExec();
}
function drawExec(){
  const ph=EX.phases[EX.idx];
  const pct=100*(1-EX.totalRem/EX.total);
  const stepBlocks=EX.phases.filter(p=>p.type==='block');
  const curBlockNo=stepBlocks.indexOf(ph);
  const doneBlocks=EX.finalizados.length;
  let stepsHTML=stepBlocks.map((p,i)=>{
    let cls='step'; if(i<doneBlocks)cls+=' done'; else if(p===ph)cls+=' now'; return `<div class="${cls}"></div>`;
  }).join('');
  let inner='';
  if(ph.type==='block'){
    const b=ph.ref;
    inner=`<div class="phase">
      <div class="ptype">${ph.warm?'Entrada en calor':'Bloque '+(ph.idx+1)+' de 4'}</div>
      <div class="pname" style="margin-top:4px">${esc(b.cat)} · ${esc(b.variante)}</div>
      <div class="muted" style="font-size:12px;margin-bottom:6px">${esc(fmtFormato(b))}</div>
      <div class="pclock">${mmss(EX.phaseRem)}</div>
      <div class="movs" style="text-align:left;max-width:340px;margin:6px auto 0">${movsHTML(b)}</div>
      <div style="height:12px"></div>
      ${EX.blockStarted
        ? `<button class="btn" onclick="finBlock()">Finalizar bloque</button>`
        : `<button class="btn dark" onclick="startBlock()">Iniciar bloque</button>`}
    </div>`;
  } else {
    inner=`<div class="phase ${ph.type}">
      <div class="ptype">${ph.type==='prep'?'Preparate — agarrá el material':'Descanso'}</div>
      <div class="pclock">${mmss(EX.phaseRem)}</div>
      <div class="pname">${ph.type==='prep'?'Arranca el warm-up':'Próximo bloque en breve'}</div>
      <button class="btn ghost sm" style="margin-top:12px" onclick="skipPhase()">Saltar</button>
    </div>`;
  }
  app.innerHTML=`
    <div class="totwrap">
      <div class="lab">Tiempo total de la rutina</div>
      <div class="clock" style="color:${EX.totalRem<=0?'var(--red)':'#fff'}">${mmss(EX.totalRem)}</div>
      <div class="totbar"><i style="width:${Math.min(100,pct)}%"></i></div>
    </div>
    <div class="steps">${stepsHTML}</div>
    ${inner}
    <div class="grid2" style="margin-top:6px">
      <button class="btn ghost" onclick="togglePause()">${EX.running?'⏸ Pausar':'▶ Reanudar'}</button>
      <button class="btn" onclick="finishRoutine('FinalizadoPorUsuario')">Finalizar rutina</button>
    </div>
    <button class="btn red" style="margin-top:10px" onclick="cancelRoutine()">Cancelar rutina</button>
    <div class="navwarn">Finalizar guarda la sesión (aunque hayas acortado). Cancelar la descarta.</div>
  `;
}
window.startBlock=()=>{EX.blockStarted=true;initAudio();sBlockStart();drawExec();};
window.finBlock=()=>advance('user');
window.skipPhase=()=>advance('skip');
window.togglePause=()=>{EX.running=!EX.running;drawExec();};
window.cancelRoutine=()=>{ if(!confirm('¿Cancelar la rutina? No se va a guardar.'))return;
  clearInterval(TICK);EX=null;toast('Rutina cancelada (no guardada)');render();};
window.finishRoutine=(cierre)=>{
  clearInterval(TICK);
  const r=EX.r;
  // asegurar registrar bloques ya finalizados; si finaliza manual, cuentan los hechos
  const finIds=[...new Set(EX.finalizados)];
  const cats=[...new Set([r.warmup.cat,...r.bloques.filter(b=>finIds.includes(b.id)).map(b=>b.cat)])];
  const regiones=[...new Set(r.bloques.filter(b=>finIds.includes(b.id)).map(b=>b.region))];
  if(regiones.length===0){ r.bloques.forEach(b=>regiones.push(b.region)); } // finalizó sin marcar bloques: registrar plan
  const sess={fecha:todayKey(),ts:Date.now(),objetivo:r.objetivo,nivel:r.nivel,
    blockIds:r.bloques.map(b=>b.id), bloquesFinalizados:finIds,
    cats:[...new Set(r.bloques.map(b=>b.cat))], regiones:[...new Set(r.bloques.map(b=>b.region))],
    removed:r.removed||[], cierre, durMin:r.durEstim};
  S.profile.historial.push(sess);
  S.profile.contador[r.objetivo]=(S.profile.contador[r.objetivo]||0)+1;
  S.routine=null;save();EX=null;
  screenDone(sess);
};
function screenDone(sess){
  app.innerHTML=`
    <div style="text-align:center;padding:28px 10px 6px">
      <div style="font-size:56px">✅</div>
      <h2 style="font-size:26px;font-weight:900;margin:10px 0 4px">¡Rutina completada!</h2>
      <p class="muted">Objetivo: <b>${objName(sess.objetivo)}</b> · ${sess.durMin} min<br>Se guardó en tu historial.</p>
    </div>
    <div class="card" style="padding:14px 16px;text-align:left">
      <div style="font-weight:900;font-size:15px">🧘 No te saltees la vuelta a la calma</div>

      <b>Comé dentro de 1–2 h</b>: proteína + carbohidratos para recuperar.<br>

    </div>
    <button class="btn" onclick="render()">Volver al inicio</button>
    <button class="btn ghost" style="margin-top:10px" onclick="screenHistory()">Ver historial</button>`;
}
